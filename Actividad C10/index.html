<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actividad C10</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>
    <div class="contenedor">
        <header class="cabecera">
            <img src="logo.jpg" alt="logo">
            <nav>
                <a href="#">Primer enlace</a>
                <a href="#">Segundo enlace</a>
                <a href="#">Tercer enlace</a>
                <a href="#">Cuarto enlace</a>
            </nav>
        </header>

        <section class="hero">
            <video autoplay muted loop>
                <source src="fondo.mp4" type="video/mp4">
                <source src="fondo.webm" type="video/webm">
                Tu navegador no soporta el vídeo de fondo.
            </video>
        </section>
        
        <aside class="lateral">
            <p>Lateral</p>
        </aside>

        <main class="contenido">
            <section class="ejemplo">
                <audio controls>
                    <source src="intro.mp3" type="audio/mpeg">
                    <source src="intro.ogg" type="audio/ogg">
                    El navegador no soporta el elemento de audio.
                </audio>

                <video controls poster="poster.jpg" width="480">
                    <source src="muestra.mp4" type="video/mp4">
                    <source src="muestra.webm" type="video/webm">
                    El navegador no soporta el elemento de vídeo.
                </video>
            </section>

            <section class="ejemplo">
                <div class="tarjeta animada">
                    <p>Tarjeta 1</p>
                    <button>Botón 1</button>
                </div>

                <div class="tarjeta">
                    <p>Tarjeta 2</p>
                    <button>Botón 2</button>
                </div>
            </section>
        </main>

        <footer class="pie">
            <p>Pie de página</p>
        </footer>
    </div>
</body>
</html>
